name: Photos du blog (Wikimedia Commons)
# Télécharge une photo libre par lac dans blog/img (le réseau de développement est limité par Wikimedia).
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  photos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          UA="MonLac-photos/1.0 (https://github.com/xiff/Le-lac)"
          while IFS='|' read -r cle fichier; do
            url="https://commons.wikimedia.org/wiki/Special:FilePath/$(python3 -c 'import sys,urllib.parse;print(urllib.parse.quote(sys.argv[1]))' "$fichier")?width=1600"
            curl -fsSL -A "$UA" -o "blog/img/photo-$cle.jpg" "$url" || echo "ECHEC $cle"
            sleep 5
          done <<'LISTE'
          gruyere|Lake Gruyère at autumn.jpg
          joux|040 Dent de Vaulion and Lac de Joux at Sunset Photo by Giles Laurent.jpg
          majeur|Waterfront of Ascona from lake.jpg
          LISTE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blog/img
          git diff --cached --quiet && exit 0
          git commit -m "Photos du blog : remplacements (Wikimedia Commons)"
          git pull --rebase origin main
          git push
