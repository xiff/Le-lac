name: Température de l'eau
on:
  schedule:
    - cron: '23 */3 * * *'  # toutes les 3 h, comme le modèle Alplakes
  workflow_dispatch:
permissions:
  contents: write
concurrency: eau
jobs:
  eau:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/eau.mjs
      - run: node scripts/qualite.mjs
      - run: node scripts/eau-jour.mjs
      - run: node scripts/pages.mjs
      # Miniatures manquantes (illustration ajoutée sans elles) : sinon l'article programmé sort avec des images cassées.
      # Ne convertit que ce qui manque ; ImageMagick n'est installé que s'il en faut et qu'il est absent. Un échec ici ne bloque pas la température.
      - name: Miniatures du blog
        continue-on-error: true
        run: node scripts/miniatures.mjs || (sudo apt-get install -y -qq imagemagick > /dev/null && node scripts/miniatures.mjs)
      - run: node scripts/blog.mjs
      - name: Publier si changé
        run: |
          git add eau.json eau-jour.json qualite.json plage blog sitemap.xml
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Température de l'eau (Alplakes)"
          git pull --rebase -X theirs origin main # un autre commit a pu arriver pendant la récupération
          git push
