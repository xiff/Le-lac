name: APK de test Android
# APK d'essai (signé avec une clé jetable) : à installer à la main, ne pas publier.
on:
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # Le kit Android est préinstallé sur les machines GitHub ; on ajoute la version qu'attend Bubblewrap.
      - name: Outils Android 36
        run: |
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "build-tools;36.1.0" "platforms;android-36"
          # Bubblewrap vérifie la présence de $ANDROID_HOME/bin (outils rangés ailleurs sur les machines GitHub)
          [ -e "$ANDROID_HOME/bin" ] || ln -s "$(dirname "$SDKM")" "$ANDROID_HOME/bin"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save @bubblewrap/core@1.27.0
      - name: Clé de test jetable
        run: keytool -genkeypair -keystore /tmp/test.keystore -alias test -keyalg RSA -keysize 2048 -validity 365 -storepass testtest -keypass testtest -dname "CN=Mon Lac test"
      - run: node android/apk-test.cjs
        env:
          KEYSTORE: /tmp/test.keystore
          KS_PASS: testtest
      - uses: actions/upload-artifact@v4
        with:
          name: mon-lac-apk-test
          path: mon-lac-test.apk
