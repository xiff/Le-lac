name: APK de test Android
# APK d'essai (signé avec une clé jetable) : à installer à la main, ne pas publier.
on:
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # Le kit Android est préinstallé sur les machines GitHub ; on ajoute la version qu'attend Bubblewrap.
      - name: Outils Android 36
        run: |
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "build-tools;36.1.0" "platforms;android-36"
          # Bubblewrap vérifie la présence de $ANDROID_HOME/bin (outils rangés ailleurs sur les machines GitHub)
          [ -e "$ANDROID_HOME/bin" ] || ln -s "$(dirname "$SDKM")" "$ANDROID_HOME/bin"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save @bubblewrap/core@1.27.0
      - name: Clé de test jetable
        run: keytool -genkeypair -keystore /tmp/test.keystore -alias test -keyalg RSA -keysize 2048 -validity 365 -storepass testtest -keypass testtest -dname "CN=Mon Lac test"
      - run: node android/apk-test.cjs
        env:
          KEYSTORE: /tmp/test.keystore
          KS_PASS: testtest
      - uses: actions/upload-artifact@v4
        with:
          name: mon-lac-apk-test
          path: mon-lac-test.apk

  # Essai sur un téléphone Android virtuel : lance l'app et garde le rapport de plantage (logcat).
  # playstore = avec Chrome ; google_apis = sans Chrome (comme un téléphone où Chrome est absent ou désactivé).
  essai:
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        target: [playstore, google_apis]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mon-lac-apk-test
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: ${{ matrix.target }}
          arch: x86_64
          disable-animations: true
          script: |
            adb install -r mon-lac-test.apk
            adb logcat -c
            adb shell monkey -p io.github.xiff.lelac -c android.intent.category.LAUNCHER 1
            sleep 25
            adb logcat -d -b crash > crash.txt || true
            adb logcat -d > logcat.txt || true
            adb exec-out screencap -p > ecran.png || true
            echo "=== PLANTAGES ===" ; cat crash.txt
            echo "=== EXTRAIT ===" ; grep -iE "lelac|AndroidRuntime|FATAL|browserhelper|TrustedWebActivity|CustomTabs" logcat.txt | tail -150
            adb shell dumpsys activity activities | grep -iE "mResumedActivity|topResumedActivity" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: essai-${{ matrix.target }}
          path: |
            crash.txt
            logcat.txt
            ecran.png
