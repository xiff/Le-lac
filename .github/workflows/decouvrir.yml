name: Découverte des plages (nouveaux lacs)
on:
  workflow_dispatch:
    inputs:
      lac:
        description: 'Un seul lac (neuchatel, bienne, morat, gruyere, sion, lugano, majeur) ; vide = tous'
        required: false
      chercher:
        description: 'Noms à chercher (Nominatim), séparés par ;'
        required: false
jobs:
  decouvrir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/decouvrir.mjs "${{ inputs.lac }}"
      - if: ${{ inputs.chercher }}
        run: IFS=";" read -ra Q <<< "${{ inputs.chercher }}"; node scripts/chercher.mjs "${Q[@]}"
