<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Le Lac aujourd’hui</title>
<meta name="description" content="Baignade, paddle, voile : les conditions du Léman en un coup d’œil.">
<meta name="theme-color" content="#0b5f8a">
<style>
  :root {
    --bg: #eef6fa; --carte: #fff; --texte: #10303f; --doux: #557482;
    --lac: #0b5f8a; --n0: #c94a3a; --n1: #d99a1e; --n2: #3b9b5d; --n3: #127a8f;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0a1a22; --carte: #12293a; --texte: #e3f0f6; --doux: #8fb0bf; --lac: #59b6e0; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 16px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--texte); }
  header { background: linear-gradient(160deg, #0b5f8a, #127a8f); color: #fff; padding: 20px 16px 56px; }
  h1 { margin: 0; font-size: 1.5rem; }
  header p { margin: 4px 0 0; opacity: .85; font-size: .9rem; }
  main { max-width: 560px; margin: -40px auto 0; padding: 0 16px 32px; }
  select { width: 100%; padding: 12px; font-size: 1rem; border-radius: 12px; border: 0; background: var(--carte); color: var(--texte); box-shadow: 0 2px 8px #0002; }
  .carte { background: var(--carte); border-radius: 16px; padding: 16px; margin-top: 12px; box-shadow: 0 2px 8px #0001; }
  .mesures { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; text-align: center; }
  .mesures b { display: block; font-size: 1.6rem; color: var(--lac); }
  .mesures small { color: var(--doux); }
  .alerte { margin: 12px 0 0; padding: 8px 12px; border-radius: 10px; background: #d99a1e22; font-size: .9rem; }
  .act { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid #8882; }
  .act:first-child { border-top: 0; }
  .act .e { font-size: 1.8rem; }
  .act div { flex: 1; }
  .act small { color: var(--doux); display: block; }
  .badge { padding: 4px 10px; border-radius: 99px; color: #fff; font-weight: 600; font-size: .85rem; white-space: nowrap; }
  .b0 { background: var(--n0); } .b1 { background: var(--n1); } .b2 { background: var(--n2); } .b3 { background: var(--n3); }
  h2 { font-size: 1rem; margin: 0 0 8px; }
  .heures { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
  .h { min-width: 56px; text-align: center; font-size: .8rem; color: var(--doux); }
  .h b { display: block; color: var(--texte); font-size: .95rem; }
  .fleche { display: inline-block; }
  footer { text-align: center; color: var(--doux); font-size: .75rem; margin-top: 20px; }
  footer a { color: inherit; }
  [hidden] { display: none; }
</style>
</head>
<body>
<header>
  <h1>🌊 Le Lac aujourd’hui</h1>
  <p id="maj">Chargement des conditions…</p>
</header>
<main>
  <label for="spot" hidden>Plage</label>
  <select id="spot"></select>

  <section class="carte">
    <div class="mesures">
      <div><b id="eau">–</b><small>eau</small></div>
      <div><b id="air">–</b><small>air</small></div>
      <div><b id="vent">–</b><small>vent km/h</small></div>
    </div>
    <p class="alerte" id="alerte" hidden></p>
  </section>

  <section class="carte" id="activites" aria-label="Conditions par activité"></section>

  <section class="carte">
    <h2>Prochaines heures</h2>
    <div class="heures" id="heures"></div>
  </section>

  <footer>
    Météo : <a href="https://open-meteo.com">Open-Meteo</a> · Eau : OFEV via <a href="https://api.existenz.ch">existenz.ch</a> (mesurée à Genève)<br>
    Indicatif seulement : vérifiez toujours sur place.
  </footer>
</main>

<script type="module">
import { ACTIVITES, estBise, meilleurCreneau } from './score.js';

const SPOTS = [
  { nom: 'Bains des Pâquis', lat: 46.2105, lon: 6.1556 },
  { nom: 'Genève-Plage', lat: 46.2189, lon: 6.1797 },
  { nom: 'Baby-Plage', lat: 46.1988, lon: 6.1606 },
  { nom: 'Nyon', lat: 46.3833, lon: 6.2417 },
  { nom: 'Lausanne – Vidy', lat: 46.5161, lon: 6.5953 },
  { nom: 'Vevey', lat: 46.4614, lon: 6.8419 },
  { nom: 'Évian', lat: 46.4010, lon: 6.5900 },
];
const LIBELLES = ['Non', 'Bof', 'Bien', 'Parfait'];
const $ = (id) => document.getElementById(id);

const sel = $('spot');
SPOTS.forEach((s, i) => sel.add(new Option(s.nom, i)));
try { sel.value = localStorage.getItem('spot') ?? 0; } catch {}
sel.onchange = () => { try { localStorage.setItem('spot', sel.value); } catch {} charger(); };

// shortcut: une seule mesure d'eau (Rhône à la Halle de l'Île, ≈ surface du lac à Genève) pour tous les spots ; brancher Alplakes (Eawag) pour une température par plage.
async function tempEau() {
  try {
    const r = await fetch('https://api.existenz.ch/apiv1/hydro/latest?locations=2606&parameters=temperature&app=lac-aujourdhui');
    const v = (await r.json()).payload?.find((p) => p.par === 'temperature')?.val;
    return typeof v === 'number' ? v : null;
  } catch { return null; }
}

async function meteo(s) {
  const champs = 'temperature_2m,wind_speed_10m,wind_gusts_10m,wind_direction_10m,weather_code';
  const r = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${s.lat}&longitude=${s.lon}&current=${champs}&hourly=${champs}&forecast_hours=12&timezone=Europe%2FZurich`);
  if (!r.ok) throw new Error('météo ' + r.status);
  return r.json();
}

const cond = (o, i, eau) => ({
  eau, air: i == null ? o.temperature_2m : o.temperature_2m[i],
  vent: i == null ? o.wind_speed_10m : o.wind_speed_10m[i],
  rafales: i == null ? o.wind_gusts_10m : o.wind_gusts_10m[i],
  dir: i == null ? o.wind_direction_10m : o.wind_direction_10m[i],
  code: i == null ? o.weather_code : o.weather_code[i],
});

async function charger() {
  const spot = SPOTS[sel.value] ?? SPOTS[0];
  $('maj').textContent = 'Chargement des conditions…';
  try {
    const [m, eau] = await Promise.all([meteo(spot), tempEau()]);
    const c = cond(m.current, null, eau);
    const heures = m.hourly.time.map((t, i) => ({ ...cond(m.hourly, i, eau), heure: t.slice(11, 13) + 'h' }));

    $('eau').textContent = eau == null ? '?' : eau.toFixed(1) + '°';
    $('air').textContent = Math.round(c.air) + '°';
    $('vent').innerHTML = `${Math.round(c.vent)} <span class="fleche" style="transform:rotate(${c.dir + 180}deg)" aria-label="direction ${c.dir}°">↑</span>`;

    const alerte = c.code >= 95 ? '⚡ Orage : sortez de l’eau.' : estBise(c) ? '🌬️ Bise en cours : vagues et courant vers le Rhône.' : c.rafales > 40 ? '💨 Fortes rafales.' : '';
    $('alerte').textContent = alerte; $('alerte').hidden = !alerte;

    $('activites').innerHTML = ACTIVITES.map((a) => {
      const n = a.note(c), cr = meilleurCreneau(heures, a.note);
      return `<div class="act"><span class="e" aria-hidden="true">${a.emoji}</span><div>${a.nom}<small>${cr ? `Meilleur créneau : ${cr.de}–${cr.a}` : 'Pas de bon créneau dans les 12 h'}</small></div><span class="badge b${n}">${LIBELLES[n]}</span></div>`;
    }).join('');

    $('heures').innerHTML = heures.map((h) => `<div class="h">${h.heure}<b>${Math.round(h.air)}°</b>${Math.round(h.vent)}<span class="fleche" style="transform:rotate(${h.dir + 180}deg)">↑</span></div>`).join('');

    $('maj').textContent = `${spot.nom} · mis à jour à ${new Date().toLocaleTimeString('fr-CH', { hour: '2-digit', minute: '2-digit' })}`;
  } catch {
    $('maj').textContent = 'Conditions indisponibles. Vérifiez votre connexion et réessayez.';
  }
}
charger();
</script>
</body>
</html>
